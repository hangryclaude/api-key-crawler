# keyguard's extra rules for betterleaks, on top of the engine defaults (docs/STEAL.md P0-11).
#
# The defaults are blind to formats the user uses: Claude Code OAuth tokens (the generic rule drops
# every secret containing the stopword "ant-"), Discord, bare ElevenLabs and fal keys,
# sb_secret_, whsec_ and Cal.com. scripts/research/multi_draw.py measures what the rules add: over
# three runs of six draws (139 files each) betterleaks recall went from 67.9-68.2% to 84.1-84.2%
# (docs/STEAL.md recorded 68.7% and 84.1%). `go test ./rules` pins this file: 475 rules with
# betterleaks 1.9.0, no repeated id, and each rule firing on a value of its format and not on a
# near miss. On 286 MB of Rust and 150 MB of Go the rules add no hit. On 1.1 GB of JS they add 23,
# all one whsec_ example in an SDK's doc comments, under node_modules, which betterleaks skips.
#
# Keep it safe to extend:
#   - new ids only, all prefixed kg-: a rule that reuses a default id replaces it;
#   - no top-level `prefilter` or `filter`: a child's replaces the upstream one and silently
#     stops betterleaks skipping node_modules/;
#   - the oat/ort/sid and sb_* formats come from third-party docs, so lengths stay loose until
#     `keyguard learn` shows the shapes of the user's own keys (docs/STEAL.md K7, G3);
#   - kg-fal-key and kg-discord-bot-token have no keyword, so betterleaks runs them over every
#     byte. Measured on 286 MB of Rust: 0.66 s with the defaults, 0.86 s with this file, 0.69 s
#     with those two disabled (--disable-rule). On 200 KB, the size of a commit, all three take 30 ms,
#     so a hook has no reason to switch them off;
#   - `confidence`, `filter` and `betterleaksMinVersion` are betterleaks keys. gitleaks reads
#     the same file and ignores them, so its entropy gates do not apply.
title = "keyguard"
betterleaksMinVersion = "v1.8.0"

[extend]
useDefault = true

# Claude Code long-lived OAuth (oat01), refresh (ort01) and claude.ai session (sid) tokens.
# The default generic-api-key rule drops every secret containing "ant-" (stopword), so these
# are invisible to the default config.
[[rules]]
id = "kg-anthropic-oauth-token"
description = "Anthropic OAuth access/refresh or session token (Claude Code, claude.ai)."
regex = '''\b(sk-ant-(?:oat|ort|sid)[0-9]{2}-[A-Za-z0-9_-]{60,200})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = ["sk-ant-oat", "sk-ant-ort", "sk-ant-sid"]
confidence = "high"
filter = '''
entropy(finding["secret"]) <= 3.5
'''

[[rules]]
id = "kg-discord-bot-token"
description = "Discord bot token (base64 snowflake . timestamp . hmac)."
regex = '''\b((?:MT|Mj|Mz|ND|NT|Nj|Nz|OD|OT)[A-Za-z0-9_-]{21,24}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,38})\b'''
confidence = "high"
filter = '''
entropy(finding["secret"]) <= 3.8
'''

[[rules]]
id = "kg-discord-webhook-url"
description = "Discord webhook URL (anyone holding it can post to the channel)."
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/(?:v[0-9]+/)?webhooks/[0-9]{17,20}/[A-Za-z0-9_-]{60,80}'''
keywords = ["/api/webhooks/", "/api/v"]
confidence = "high"

[[rules]]
id = "kg-telegram-bot-token"
description = "Telegram bot token without a nearby 'telegram' keyword."
regex = '''\b([0-9]{8,10}:A[A-Za-z0-9_-]{34})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = [":a"]
confidence = "medium"
filter = '''
entropy(finding["secret"]) <= 3.5
'''

[[rules]]
id = "kg-stripe-webhook-secret"
description = "Stripe webhook signing secret."
regex = '''\b(whsec_[A-Za-z0-9+/=]{32,64})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = ["whsec_"]
confidence = "high"
filter = '''
entropy(finding["secret"]) <= 3.0
'''

[[rules]]
id = "kg-elevenlabs-key"
description = "ElevenLabs API key (sk_ + 48 hex) without the elevenlabs keyword."
regex = '''\b(sk_[a-f0-9]{48})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = ["sk_"]
confidence = "medium"
filter = '''
entropy(finding["secret"]) <= 3.2
'''

[[rules]]
id = "kg-fal-key"
description = "fal.ai key id:secret pair without a fal keyword."
regex = '''\b([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}:[a-f0-9]{32})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
confidence = "high"
filter = '''
entropy(finding["secret"]) <= 3.2
'''

[[rules]]
id = "kg-supabase-secret-key"
description = "Supabase sb_secret_ key, reported even when no project URL is nearby."
regex = '''\b(sb_secret_[A-Za-z0-9_-]{20,64})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = ["sb_secret_"]
confidence = "high"
filter = '''
entropy(finding["secret"]) <= 3.5
'''

[[rules]]
id = "kg-aws-access-key-id"
description = "AWS access key id with no secret key in range (the default pair rule needs both)."
regex = '''\b((?:AKIA|ASIA)[A-Z2-7]{16})\b'''
keywords = ["akia", "asia"]
confidence = "low"
filter = '''
entropy(finding["secret"]) <= 3.0 || matchesAny(finding["secret"], [`.+EXAMPLE$`])
'''

[[rules]]
id = "kg-calcom-api-key"
description = "Cal.com live-mode API key (cal_live_ prefix per Cal.com API docs)."
regex = '''\b(cal_live_[A-Za-z0-9]{20,64})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = ["cal_live_"]
confidence = "high"
filter = '''
entropy(finding["secret"]) <= 3.5
'''

[[rules]]
id = "kg-twilio-auth-token"
description = "Twilio auth token (32 hex) next to a twilio identifier; lower entropy floor than generic-api-key."
regex = '''(?i:(?:twilio)(?:[ \t\w.-]{0,20})[\s'"]{0,3})(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-f0-9]{32})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = ["twilio"]
confidence = "medium"
filter = '''
entropy(finding["secret"]) <= 2.8
'''

[[rules]]
id = "kg-zerobounce-api-key"
description = "ZeroBounce API key (32 hex) next to a zerobounce identifier."
regex = '''(?i:(?:zerobounce|zero_bounce|zero-bounce)(?:[ \t\w.-]{0,20})[\s'"]{0,3})(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-f0-9]{32})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
keywords = ["zerobounce", "zero_bounce", "zero-bounce"]
confidence = "medium"
filter = '''
entropy(finding["secret"]) <= 2.8
'''
